name: Build trap-webhook

on:
  push:
    branches: [main]
    paths:
      - "trap-webhook/**"
      - "flake.*"
      - ".github/workflows/build.trap-webhook.yml"
  pull_request:
    branches: [main]
    paths:
      - "trap-webhook/**"
      - "flake.*"
      - ".github/workflows/build.trap-webhook.yml"
  workflow_dispatch:

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - uses: nixbuild/nix-quick-install-action@v34
      - run: nix develop -c just trap-webhook::lint
      - run: nix develop -c just trap-webhook::fmt
      - run: git diff --exit-code

  test:
    needs: check
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - uses: nixbuild/nix-quick-install-action@v34
      - run: nix develop -c just trap-webhook::test

  build:
    needs: check
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - uses: nixbuild/nix-quick-install-action@v34
      - run: nix develop -c just trap-webhook::build
