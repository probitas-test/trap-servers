name: Docker trap-smtp

on:
  push:
    branches: [main]
    paths:
      - "trap-smtp/**"
      - ".github/workflows/docker.trap-smtp.yml"
  release:
    types: [published]
  workflow_dispatch:

# A running publish is never cancelled; a newer run for the same ref waits for
# it, so the pushed image always ends at the newest commit.
concurrency:
  group: docker-trap-smtp-${{ github.ref }}
  cancel-in-progress: false

permissions:
  contents: read

env:
  REGISTRY: ghcr.io
  IMAGE_NAME: probitas-test/trap-smtp

jobs:
  publish:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - uses: docker/setup-qemu-action@v4
      - uses: docker/setup-buildx-action@v4
      - uses: docker/login-action@v4
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - uses: docker/metadata-action@v6
        id: meta
        with:
          images: ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}
          tags: |
            type=raw,value=latest
            type=ref,event=branch
            type=ref,event=tag
      - uses: docker/build-push-action@v7
        with:
          context: ./trap-smtp
          platforms: linux/amd64,linux/arm64
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
